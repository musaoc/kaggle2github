[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle2github"
version = "0.1.0"
description = "Turn Kaggle notebooks into production-ready, recruiter-grade GitHub repositories."
readme = "README.md"
authors = [
    { name = "Muhammad Musa Khan", email = "musakhanmiz9@gmail.com" }
]
license = { text = "MIT" }
keywords = ["kaggle", "github", "migration", "portfolio", "data-science", "machine-learning", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "kaggle>=1.6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
kaggle2github = "kaggle2github.cli:main"

[project.urls]
Homepage = "https://github.com/musaoc/kaggle2github"
Repository = "https://github.com/musaoc/kaggle2github"
Issues = "https://github.com/musaoc/kaggle2github/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
